<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Графік відключень · Львів</title>
<link rel="icon" href="assets/logo-mark.png">
<style>
@font-face { font-family: "Carlito"; src: url("assets/Carlito-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Fira Sans"; src: url("assets/FiraSans-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Fira Sans"; src: url("assets/FiraSans-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Fira Sans"; src: url("assets/FiraSans-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }

:root {
  --green: #5d894a;
  --green-dark: #426334;
  --orange: #ed952c;
  --ink: #1f2420;
  --muted: #6e756c;
  --rule: #dbe0d6;
  --head-bg: #f1f4ee;
  --bg: #ffffff;
  --on: #e3eddc;
  --off: #9e3430;
  --cancelled: #8ccb6e;
  --extra: #ed952c;
  --h1: #ecd3c4;
  --h2: #d9a089;
  --h3: #bf6455;
  --h4: #9e3430;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 "Fira Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

.top { background: var(--green); color: #fff; }
.top .in { max-width: 1240px; margin: 0 auto; padding: 28px 32px; display: flex; align-items: center; gap: 28px; }
.top img { height: 64px; width: auto; display: block; }
.top h1 { font: 700 44px/1 "Carlito", sans-serif; margin: 0; letter-spacing: -0.005em; }
.top .sub { font: 700 26px/1.1 "Carlito", sans-serif; color: var(--orange); margin-top: 8px; }
.top .meta { margin-left: auto; text-align: right; }
.top .meta small { display: block; color: #dee9d6; font-size: 15px; }
.top .meta b { font-weight: 600; font-size: 22px; }

main { max-width: 1240px; margin: 0 auto; padding: 8px 32px 48px; }
section { padding: 32px 0; border-bottom: 1px solid var(--rule); }
section:last-of-type { border-bottom: 0; }
.bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.bar h2 { font: 700 30px/1.1 "Carlito", sans-serif; margin: 0; }
.bar .note { color: var(--muted); font-size: 15px; }
.nav { display: inline-flex; gap: 6px; margin-left: auto; }
.nav button, .btn {
  background: #fff; border: 1px solid var(--rule); padding: 7px 14px; cursor: pointer; font-weight: 500;
}
.nav button:hover, .btn:hover { border-color: var(--green); }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn.primary:hover { background: var(--green-dark); }
.btn:disabled { opacity: .45; cursor: default; }

.days { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grid { display: grid; grid-template-columns: 116px repeat(12, minmax(0, 1fr)); }
.grid .h { background: var(--green-dark); color: #fff; font-weight: 500; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
.grid .h.t { justify-content: flex-start; padding-left: 12px; }
.grid .s { background: var(--head-bg); height: 46px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.grid .s.t { justify-content: flex-start; padding-left: 12px; font-weight: 400; font-size: 14px; color: var(--muted); }
.grid .t.r { height: 34px; display: flex; align-items: center; padding-left: 12px; font-size: 16px; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.grid .c { height: 34px; border: 1px solid #fff; background: var(--on); }
.grid .c.off { background: var(--off); }
.grid .c.cancelled { background: var(--cancelled); }
.grid .c.extra { background: var(--extra); }
.grid .mine { box-shadow: inset 0 -3px 0 var(--orange); }

.legend { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 20px; font-size: 16px; }
.legend span { display: inline-flex; align-items: center; gap: 10px; }
.legend i { width: 20px; height: 20px; display: inline-block; }
.legend .scale { gap: 8px; }
.legend .scale i { width: 90px; height: 14px; }
.legend .scale small { font-size: 15px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { background: #fff; border: 1px solid var(--rule); padding: 6px 12px; cursor: pointer; font-weight: 500; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { font-size: 14px; color: var(--muted); padding: 0 8px 4px; }
.day { min-width: 0; overflow: hidden; height: 84px; border: 0; padding: 8px 10px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; background: var(--head-bg); color: var(--ink); }
.day.empty { background: none; cursor: default; }
.day b { font-weight: 600; font-size: 17px; }
.day span { font-size: 15px; font-variant-numeric: tabular-nums; }
.day.nodata span { color: var(--muted); }
.day.dark { color: #fff; }
.day.sel { outline: 3px solid var(--orange); outline-offset: -3px; }
.day.today b { text-decoration: underline; text-decoration-color: var(--orange); text-decoration-thickness: 3px; text-underline-offset: 3px; }

table.sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.sum th { background: var(--green-dark); color: #fff; font-weight: 500; text-align: right; padding: 12px; font-size: 15px; }
table.sum th:first-child, table.sum td:first-child { text-align: left; }
table.sum td { padding: 11px 12px; border-bottom: 1px solid var(--rule); text-align: right; font-size: 16px; }
table.sum tr.mine td { background: var(--head-bg); font-weight: 600; }

.versions { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; margin-bottom: 18px; }
.versions .lbl { align-self: center; color: var(--muted); font-size: 15px; margin-right: 6px; }
.ver { background: #fff; border: 1px solid var(--rule); padding: 6px 12px; cursor: pointer; text-align: left; line-height: 1.25; }
.ver b { display: block; font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.ver small { color: var(--muted); font-size: 13px; }
.ver[aria-pressed="true"] { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }
.ver[aria-pressed="true"] small { color: #dee9d6; }
.changes { margin-top: 22px; }
.changes h3 { font: 700 22px/1.2 "Carlito", sans-serif; margin: 0 0 10px; }
.changes ul { list-style: none; margin: 0; padding: 0; }
.changes li { padding: 8px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 22px 64px 1fr auto; gap: 10px; align-items: baseline; font-variant-numeric: tabular-nums; }
.changes li i { width: 14px; height: 14px; display: inline-block; align-self: center; }
.changes li .d { color: var(--muted); white-space: nowrap; }
.day .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
.day .badge { font-size: 12px; font-weight: 600; padding: 1px 6px; background: rgba(255,255,255,.85); color: var(--ink); white-space: nowrap; }
.period { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
.period .presets { display: flex; flex-wrap: wrap; gap: 6px; }
.period label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; }
.period input { font: inherit; color: var(--ink); border: 1px solid var(--rule); padding: 6px 8px; background: #fff; width: 8.2em; font-variant-numeric: tabular-nums; }
.period input:focus { outline: 2px solid var(--green); outline-offset: -1px; }
.period input.bad { border-color: var(--off); outline-color: var(--off); }
.period .sep { flex: 1; }
.seg { display: inline-flex; }
.seg .chip + .chip { margin-left: -1px; }
.seg .chip:disabled { opacity: .45; cursor: default; }
.kpis { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 18px; border: 1px solid var(--rule); }
.kpis div { padding: 12px 18px; border-right: 1px solid var(--rule); min-width: 160px; }
.kpis div:last-child { border-right: 0; }
.kpis small { display: block; color: var(--muted); font-size: 14px; }
.kpis b { font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; }

.empty-msg { padding: 28px; background: var(--head-bg); color: var(--muted); }
footer { max-width: 1240px; margin: 0 auto; padding: 0 32px 40px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 15px; }
footer a { color: var(--green-dark); font-weight: 600; text-decoration: none; }

@media (max-width: 1000px) {
  .days { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .top .in { padding: 20px 16px; gap: 16px; flex-wrap: wrap; }
  .top img { height: 44px; }
  .top h1 { font-size: 30px; }
  .top .sub { font-size: 20px; }
  .top .meta { margin-left: 0; text-align: left; width: 100%; }
  main { padding: 0 16px 32px; }
  footer { padding: 0 16px 32px; }
  .bar h2 { font-size: 24px; }
  .nav { margin-left: 0; }
  .grid { grid-template-columns: 92px repeat(12, minmax(0, 1fr)); }
  .grid .h { font-size: 13px; height: 40px; }
  .grid .s { font-size: 13px; height: 40px; }
  .grid .s.t { font-size: 12px; padding-left: 8px; }
  .grid .h.t, .grid .t.r { padding-left: 8px; }
  .grid .t.r { font-size: 13px; height: 30px; }
  .grid .c { height: 30px; }
  .day { height: 62px; padding: 6px; }
  .day b { font-size: 15px; }
  .day span { font-size: 12px; }
  .hide-sm { display: none; }
  .changes li { grid-template-columns: 18px 44px 1fr; }
  .changes li .d { grid-column: 3; }
  .day .badge { font-size: 10px; line-height: 14px; min-width: 14px; text-align: center; padding: 0 3px; background: var(--orange); color: #fff; border-radius: 7px; }
  .day .badge .ar { display: none; }
  .day .u { display: none; }
  .day > span { font-size: 16px; font-weight: 600; }
  .day b { font-size: 12px; font-weight: 500; opacity: .8; }
  .period .sep { display: none; }
  .kpis div { min-width: 50%; border-bottom: 1px solid var(--rule); }
  table.sum td, table.sum th { padding: 10px 6px; font-size: 14px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <img src="assets/logo-mark.png" alt="Львів Електрохарчування">
    <div>
      <h1>Графік погодинних відключень</h1>
      <div class="sub">Львів · календар і статистика</div>
    </div>
    <div class="meta" id="meta"></div>
  </div>
</header>

<main>
  <section id="daySec">
    <div class="bar">
      <h2 id="dayTitle">—</h2>
      <span class="note" id="dayNote"></span>
      <div class="nav">
        <button id="dPrev" aria-label="Попередній день">‹</button>
        <button id="dToday">Сьогодні</button>
        <button id="dNext" aria-label="Наступний день">›</button>
      </div>
    </div>
    <div id="dayBody"></div>
  </section>

  <section>
    <div class="bar">
      <h2 id="monthTitle">—</h2>
      <span class="note">Скільки годин не було світла за день · ↻ — скільки разів змінювали графік</span>
      <div class="nav">
        <button id="mPrev" aria-label="Попередній місяць">‹</button>
        <button id="mNext" aria-label="Наступний місяць">›</button>
      </div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Моя група"></div>
    <div class="cal" id="cal"></div>
    <div class="legend">
      <span class="scale"><small>0 год</small><i id="gradBar"></i><small>6 год</small><i id="gradBar2"></i><small>12+ год</small></span>
      <span><i style="background:var(--head-bg)"></i>немає даних</span>
    </div>
  </section>

  <section>
    <div class="bar">
      <h2 id="sumTitle">Підсумок за період</h2>
    </div>
    <div class="period">
      <div class="presets" id="presets"></div>
      <span class="sep"></span>
      <label>з <input type="text" id="pFrom" inputmode="numeric" placeholder="дд.мм.рррр" maxlength="10" autocomplete="off"></label>
      <label>по <input type="text" id="pTo" inputmode="numeric" placeholder="дд.мм.рррр" maxlength="10" autocomplete="off"></label>
      <span class="seg" id="pngMode" role="group" aria-label="Вигляд PNG"></span>
      <button class="btn primary" id="png">Завантажити PNG</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div id="sum"></div>
  </section>
</main>

<footer>
  <span>Дані: графіки Львівобленерго, зібрані ботом</span>
  <a href="https://t.me/lvivpoweroutage">t.me/lvivpoweroutage</a>
</footer>

<script>
const GROUPS = ["1.1","1.2","2.1","2.2","3.1","3.2","4.1","4.2","5.1","5.2","6.1","6.2"];
const MONTHS = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
const MONTHS_GEN = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const WEEKDAYS = ["Неділя","Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];
const DOW = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
const C = { green: "#5d894a", greenDark: "#426334", orange: "#ed952c", ink: "#1f2420", muted: "#6e756c", rule: "#dbe0d6", headBg: "#f1f4ee",
  on: "#e3eddc", off: "#9e3430", h: ["#ecd3c4", "#d9a089", "#bf6455", "#9e3430"] };

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

const pad = n => String(n).padStart(2, "0");
const esc = v => String(v).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const TIME_RE = /^([01]\d|2[0-4]):[0-5]\d$/;
const DATE_RE = /^\d{2}\.\d{2}\.\d{4}$/;
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const hhmm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
const fmtDate = k => { const d = dateOf(k); return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`; };
const uaDate = k => { const [y, m, d] = k.split("-"); return `${d}.${m}.${y}`; };
const parseUa = v => {
  const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(v); if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  return d.getDate() === +m[1] && d.getMonth() === +m[2] - 1 && +m[3] >= 2020 && +m[3] <= 2100 ? keyOf(d) : null;
};
const timeOf = upd => (upd || "").split(" ")[0] || "—";

let days = {};
let group = store.get("loe-group", "1.1");
if (!GROUPS.includes(group)) group = "1.1";
let month = new Date(); month = new Date(month.getFullYear(), month.getMonth(), 1);
let selected = keyOf(new Date());
let versionIdx = null;
let pFrom, pTo, preset = store.get("loe-preset", "month");
const MAX_TABLE_DAYS = 62;
let pngMode = store.get("loe-pngmode", "table");
const currentMode = n => (pngMode === "table" && n <= MAX_TABLE_DAYS) ? "table" : "bars";

function hoursShort(min) {
  if (min == null) return "—";
  const h = Math.floor(min / 60), m = min % 60;
  return m === 0 ? String(h) : m === 30 ? `${h},5` : `${h}:${pad(m)}`;
}
function hoursLong(min) {
  if (min == null) return "—";
  if (min === 0) return "0 год";
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return `${h} год ${m} хв`;
  return h ? `${h} год` : `${m} хв`;
}
function hoursDec(min) {
  if (min == null) return "—";
  const h = Math.round(min / 6) / 10;
  return `${String(h).replace(".", ",")} год`;
}
function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
}

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(f); f = ""; if (row.some(x => x !== "")) rows.push(row); row = [];
    } else f += ch;
  }
  row.push(f); if (row.some(x => x !== "")) rows.push(row);
  return rows;
}

function slots(iv) {
  const out = new Array(48).fill(false);
  for (const [a, b] of iv || []) {
    const s = toMin(a), e = toMin(b);
    for (let i = 0; i < 48; i++) if (s < (i + 1) * 30 && e > i * 30) out[i] = true;
  }
  return out;
}
const minutesOf = iv => iv ? iv.reduce((s, [a, b]) => s + toMin(b) - toMin(a), 0) : null;
const sameIv = (a, b) => JSON.stringify(a || []) === JSON.stringify(b || []);

function groupChanges(prev, cur) {
  const out = [];
  for (const g of GROUPS) {
    const o = prev[g], n = cur[g];
    if (o === undefined && n === undefined) continue;
    if (sameIv(o, n)) continue;
    const delta = (minutesOf(n) || 0) - (minutesOf(o) || 0);
    out.push({ g, o: o || [], n: n || [], delta });
  }
  return out;
}

function buildDays(rows) {
  const [head, ...body] = rows;
  const ix = n => head.indexOf(n);
  const I = { at: ix("зафіксовано"), date: ix("дата"), upd: ix("станом_на"), g: ix("група"), a: ix("з"), b: ix("до") };
  const versions = {};
  for (const r of body) {
    const date = r[I.date]; if (!date || !DATE_RE.test(date)) continue;
    const [dd, mm, yy] = date.split(".");
    const k = `${yy}-${mm}-${dd}`;
    const vk = r[I.at] + "|" + r[I.upd];
    const v = ((versions[k] ||= {})[vk] ||= { at: r[I.at], updated: r[I.upd], groups: {} });
    const g = r[I.g]; if (!GROUPS.includes(g)) continue;
    (v.groups[g] ||= []);
    if (TIME_RE.test(r[I.a]) && TIME_RE.test(r[I.b])) v.groups[g].push([r[I.a], r[I.b]]);
  }
  const out = {};
  for (const [k, vs] of Object.entries(versions)) {
    const list = Object.values(vs).sort((x, y) => (x.at + x.updated).localeCompare(y.at + y.updated));
    list.forEach((v, i) => {
      v.minutes = {}; for (const g of GROUPS) v.minutes[g] = minutesOf(v.groups[g]);
      v.changes = i ? groupChanges(list[i - 1].groups, v.groups) : null;
    });
    const last = list[list.length - 1];
    out[k] = { list, last, minutes: last.minutes, updates: list.length - 1 };
  }
  return out;
}

const SCALE = [[0, [100, 42, 49]], [0.5, [33, 86, 56]], [1, [5, 64, 48]]];
const HEAT_MAX = 720;
function scaleColor(t) {
  t = Math.max(0, Math.min(1, t));
  let i = 1; while (i < SCALE.length - 1 && t > SCALE[i][0]) i++;
  const [t0, c0] = SCALE[i - 1], [t1, c1] = SCALE[i], k = (t - t0) / (t1 - t0);
  const [h, sat, l] = c0.map((v, j) => v + (c1[j] - v) * k);
  return `hsl(${h.toFixed(1)}, ${sat.toFixed(1)}%, ${l.toFixed(1)}%)`;
}
const scaleDark = t => t >= 0.72;
function heat(min) {
  if (min == null) return ["var(--head-bg)", false];
  const t = min / HEAT_MAX;
  return [scaleColor(t), scaleDark(t)];
}
function heatHex(min) { return min == null ? C.headBg : scaleColor(min / HEAT_MAX); }


function renderMeta() {
  const keys = Object.keys(days).sort();
  const last = keys.length ? days[keys[keys.length - 1]].last : null;
  document.getElementById("meta").innerHTML = last && last.updated
    ? `<small>Останнє оновлення</small><b>${esc(last.updated)}</b>` : "";
}

function changeLine(c) {
  const ivs = a => a.length ? a.map(([x, y]) => `${x}–${y}`).join(", ") : "без відключень";
  const color = c.delta > 0 ? "var(--off)" : c.delta < 0 ? "var(--cancelled)" : "var(--orange)";
  const what = c.delta > 0 ? `+${hoursLong(c.delta)}` : c.delta < 0 ? `−${hoursLong(-c.delta)}` : "зсув у часі";
  return `<li><i style="background:${color}"></i><b>${c.g}</b><span>${esc(ivs(c.o))} → ${esc(ivs(c.n))}</span><span class="d">${what}</span></li>`;
}

function renderDay() {
  const body = document.getElementById("dayBody");
  const d = dateOf(selected);
  document.getElementById("dayTitle").textContent = `${WEEKDAYS[d.getDay()]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`;
  const info = days[selected];
  const note = document.getElementById("dayNote");
  if (!info) { note.textContent = ""; body.innerHTML = `<div class="empty-msg">Для цього дня графіка немає.</div>`; return; }
  const list = info.list;
  if (versionIdx == null || versionIdx >= list.length) versionIdx = list.length - 1;
  const v = list[versionIdx], prev = versionIdx ? list[versionIdx - 1] : null;
  note.textContent = info.updates
    ? `Графік змінювали ${info.updates} ${plural(info.updates, "раз", "рази", "разів")} за день` : "";

  let html = "";
  if (list.length > 1) {
    html += `<div class="versions"><span class="lbl">Версії графіка:</span>`;
    list.forEach((x, i) => {
      const sub = i === 0 ? "перша" : x.changes.length ? `змінено ${x.changes.length} ${plural(x.changes.length, "групу", "групи", "груп")}` : "уточнено час";
      html += `<button class="ver" data-v="${i}" aria-pressed="${i === versionIdx}"><b>${esc(timeOf(x.updated))}</b><small>${sub}</small></button>`;
    });
    html += `</div>`;
  }
  const ns = {}, os = {};
  for (const g of GROUPS) { ns[g] = slots(v.groups[g]); os[g] = prev ? slots(prev.groups[g]) : null; }
  const cls = (g, i) => {
    const n = ns[g][i], o = os[g];
    if (o && n && !o[i]) return "c extra";
    if (o && !n && o[i]) return "c cancelled";
    return n ? "c off" : "c";
  };
  html += `<div class="days">`;
  for (let half = 0; half < 2; half++) {
    html += `<div class="grid"><div class="h t">Час</div>`;
    html += GROUPS.map(g => `<div class="h">${g}</div>`).join("");
    html += `<div class="s t">Год. за добу</div>`;
    html += GROUPS.map(g => `<div class="s${g === group ? " mine" : ""}">${hoursShort(v.minutes[g])}</div>`).join("");
    for (let r = 0; r < 24; r++) {
      const i = half * 24 + r;
      html += `<div class="t r">${hhmm(i * 30)}–${hhmm(i * 30 + 30)}</div>`;
      html += GROUPS.map(g => `<div class="${cls(g, i)}"></div>`).join("");
    }
    html += `</div>`;
  }
  html += `</div><div class="legend">
    <span><i style="background:var(--on)"></i>Є світло</span>
    <span><i style="background:var(--off)"></i>Немає світла</span>
    ${prev ? `<span><i style="background:var(--cancelled)"></i>Відключення скасоване</span>
    <span><i style="background:var(--extra)"></i>Додаткове відключення</span>` : ""}
  </div>`;
  if (prev && v.changes.length) {
    html += `<div class="changes"><h3>Що змінилося о ${esc(timeOf(v.updated))} (порівняно з ${esc(timeOf(prev.updated))})</h3>`;
    html += `<ul>${v.changes.map(changeLine).join("")}</ul></div>`;
  }
  body.innerHTML = html;
  body.querySelectorAll(".ver").forEach(b => b.onclick = () => { versionIdx = Number(b.dataset.v); renderDay(); });
}

function renderChips() {
  const el = document.getElementById("chips");
  el.innerHTML = "";
  for (const g of GROUPS) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = g;
    b.setAttribute("aria-pressed", String(g === group));
    b.onclick = () => { group = g; store.set("loe-group", g); render(); };
    el.appendChild(b);
  }
}

function renderCal() {
  const y = month.getFullYear(), m = month.getMonth();
  document.getElementById("monthTitle").textContent = `${MONTHS[m]} ${y} · група ${group}`;
  const cal = document.getElementById("cal");
  cal.innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join("");
  const first = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < first; i++) cal.insertAdjacentHTML("beforeend", `<div class="day empty"></div>`);
  const today = keyOf(new Date());
  for (let d = 1; d <= n; d++) {
    const k = keyOf(new Date(y, m, d)), info = days[k], min = info ? info.minutes[group] : null;
    const [bg, dark] = heat(min);
    const b = document.createElement("button");
    b.className = "day" + (min == null ? " nodata" : "") + (dark ? " dark" : "") + (k === selected ? " sel" : "") + (k === today ? " today" : "");
    b.style.background = bg;
    const badge = info && info.updates ? `<span class="badge" title="Змін графіка за день"><span class="ar">↻ </span>${info.updates}</span>` : "";
    b.innerHTML = `<div class="top-row"><b>${d}</b>${badge}</div><span>${min == null ? "—" : `${hoursShort(min)}<span class="u"> год</span>`}</span>`;
    b.onclick = () => { selected = k; versionIdx = null; render(); document.getElementById("daySec").scrollIntoView({ behavior: "smooth" }); };
    cal.appendChild(b);
  }
}

const PRESETS = [
  ["month", "Цей місяць"], ["prev", "Минулий місяць"], ["7", "7 днів"], ["30", "30 днів"], ["all", "Увесь час"]
];
function applyPreset(id) {
  const t = new Date(), tk = keyOf(t);
  if (id === "month") { pFrom = keyOf(new Date(t.getFullYear(), t.getMonth(), 1)); pTo = keyOf(new Date(t.getFullYear(), t.getMonth() + 1, 0)); }
  else if (id === "prev") { pFrom = keyOf(new Date(t.getFullYear(), t.getMonth() - 1, 1)); pTo = keyOf(new Date(t.getFullYear(), t.getMonth(), 0)); }
  else if (id === "7") { pFrom = addDays(tk, -6); pTo = tk; }
  else if (id === "30") { pFrom = addDays(tk, -29); pTo = tk; }
  else if (id === "all") { const ks = Object.keys(days).sort(); pFrom = ks[0] || tk; pTo = ks[ks.length - 1] || tk; }
  preset = id; store.set("loe-preset", id);
}
function periodKeys() {
  const out = []; let k = pFrom <= pTo ? pFrom : pTo; const end = pFrom <= pTo ? pTo : pFrom;
  while (k <= end && out.length < 1000) { out.push(k); k = addDays(k, 1); }
  return out;
}
function periodStats() {
  const keys = periodKeys();
  const groups = GROUPS.map(g => {
    let total = 0, known = 0, withOut = 0; const perDay = [];
    for (const k of keys) {
      const info = days[k], v = info ? info.minutes[g] : null;
      perDay.push(v); if (v != null) { known++; total += v; if (v > 0) withOut++; }
    }
    return { g, total, known, withOut, avg: known ? Math.round(total / known) : null, perDay };
  });
  const updates = keys.map(k => days[k] ? days[k].updates : null);
  const daysKnown = updates.filter(u => u != null).length;
  const totalUpdates = updates.reduce((s, u) => s + (u || 0), 0);
  return { keys, groups, updates, daysKnown, totalUpdates };
}
function periodLabel() {
  const [a, b] = pFrom <= pTo ? [pFrom, pTo] : [pTo, pFrom];
  const da = dateOf(a), db = dateOf(b);
  if (a === b) return fmtDate(a);
  if (da.getFullYear() === db.getFullYear() && da.getMonth() === db.getMonth())
    return `${da.getDate()}–${db.getDate()} ${MONTHS_GEN[db.getMonth()]} ${db.getFullYear()}`;
  if (da.getFullYear() === db.getFullYear())
    return `${da.getDate()} ${MONTHS_GEN[da.getMonth()]} – ${db.getDate()} ${MONTHS_GEN[db.getMonth()]} ${db.getFullYear()}`;
  return `${fmtDate(a)} – ${fmtDate(b)}`;
}

function renderPeriod() {
  const pr = document.getElementById("presets");
  pr.innerHTML = "";
  for (const [id, label] of PRESETS) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label; b.setAttribute("aria-pressed", String(id === preset));
    b.onclick = () => { applyPreset(id); renderPeriod(); };
    pr.appendChild(b);
  }
  for (const [id, k] of [["pFrom", pFrom], ["pTo", pTo]]) {
    const el = document.getElementById(id);
    if (document.activeElement !== el) { el.value = uaDate(k); el.classList.remove("bad"); }
  }
  document.getElementById("sumTitle").textContent = `Підсумок: ${periodLabel()}`;
  const st = periodStats();
  const mine = st.groups.find(s => s.g === group);
  document.getElementById("png").disabled = !st.daysKnown;
  const tableOk = st.keys.length <= MAX_TABLE_DAYS;
  const mode = currentMode(st.keys.length);
  const seg = document.getElementById("pngMode");
  seg.innerHTML = "";
  for (const [id, label] of [["table", "Таблиця по днях"], ["bars", "Діаграма"]]) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label;
    b.setAttribute("aria-pressed", String(id === mode));
    if (id === "table" && !tableOk) { b.disabled = true; b.title = `Таблиця по днях — до ${MAX_TABLE_DAYS} днів`; }
    b.onclick = () => { pngMode = id; store.set("loe-pngmode", id); renderPeriod(); };
    seg.appendChild(b);
  }
  document.getElementById("kpis").innerHTML = st.daysKnown ? `
    <div><small>Днів з графіком</small><b>${st.daysKnown} з ${st.keys.length}</b></div>
    <div><small>Змін графіка</small><b>${st.totalUpdates}</b></div>
    <div><small>Група ${group}: без світла</small><b>${hoursDec(mine.total)}</b></div>
    <div><small>Група ${group}: в середньому</small><b>${hoursDec(mine.avg)} / день</b></div>` : "";
  document.getElementById("sum").innerHTML = st.daysKnown ? `<table class="sum">
    <tr><th>Група</th><th class="hide-sm">Днів з відключеннями</th><th>Всього без світла</th><th>В середньому за день</th></tr>
    ${st.groups.map(s => `<tr class="${s.g === group ? "mine" : ""}"><td>${s.g}</td><td class="hide-sm">${s.withOut} з ${s.known}</td><td>${hoursDec(s.total)}</td><td>${hoursDec(s.avg)}</td></tr>`).join("")}
  </table>` : `<div class="empty-msg">За цей період даних немає.</div>`;
}

async function exportPNG() {
  const st = periodStats();
  await document.fonts.ready;
  const logo = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = "assets/logo-mark.png"; });
  const heatmap = currentMode(st.keys.length) === "table";
  const S = 2, M = 32, headH = 150, labelW = 76, rowH = 40;
  const totalW = 150, avgW = 150;
  const top = headH + 36;
  const W = heatmap ? Math.max(1100, M * 2 + labelW + st.keys.length * (st.keys.length > 31 ? 32 : 38) + totalW) : 1280;
  const cell = heatmap ? Math.floor((W - M * 2 - labelW - totalW) / st.keys.length) : 0;
  const rows = 12 + (heatmap ? 1 : 0);
  const H = top + rowH * (rows + 1) + 96;
  const cv = document.createElement("canvas"); cv.width = W * S; cv.height = H * S;
  const x = cv.getContext("2d"); x.scale(S, S);
  const F = (w, s) => `${w} ${s}px "Fira Sans", sans-serif`;
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
  x.fillStyle = C.green; x.fillRect(0, 0, W, headH);
  let tx = M;
  if (logo) { const lh = 64, lw = logo.width * lh / logo.height; x.drawImage(logo, M, (headH - lh) / 2, lw, lh); tx = M + lw + 28; }
  x.textBaseline = "alphabetic"; x.textAlign = "left";
  x.fillStyle = "#fff"; x.font = `700 44px "Carlito", sans-serif`;
  x.fillText("Без світла · Львів", tx, 76);
  x.fillStyle = C.orange; x.font = `700 26px "Carlito", sans-serif`;
  x.fillText(periodLabel(), tx, 114);
  x.textAlign = "right"; x.fillStyle = "#dee9d6"; x.font = F(400, 15);
  x.fillText("Змін графіка за період", W - M, 76);
  x.fillStyle = "#fff"; x.font = F(600, 26);
  x.fillText(String(st.totalUpdates), W - M, 112);
  x.textBaseline = "middle";

  if (heatmap) {
    const gx = M + labelW;
    x.fillStyle = C.greenDark; x.fillRect(M, top, W - 2 * M, rowH);
    x.fillStyle = "#fff"; x.font = F(500, 15); x.textAlign = "left";
    x.fillText("Група", M + 10, top + rowH / 2);
    x.textAlign = "center";
    st.keys.forEach((k, i) => {
      const d = dateOf(k), lbl = (i === 0 || d.getDate() === 1) ? `${d.getDate()}.${pad(d.getMonth() + 1)}` : String(d.getDate());
      x.font = F(500, lbl.length > 2 ? 12 : 15);
      x.fillText(lbl, gx + i * cell + cell / 2, top + rowH / 2);
    });
    x.textAlign = "right"; x.font = F(500, 15); x.fillText("Всього", W - M - 12, top + rowH / 2);
    st.groups.forEach((s, gi) => {
      const ry = top + rowH * (gi + 1);
      x.textAlign = "left"; x.fillStyle = C.ink; x.font = F(600, 17); x.fillText(s.g, M + 10, ry + rowH / 2);
      s.perDay.forEach((v, i) => {
        const cx = gx + i * cell;
        x.fillStyle = heatHex(v); x.fillRect(cx + 1, ry + 1, cell - 2, rowH - 2);
        if (v != null) { x.fillStyle = scaleDark(v / HEAT_MAX) ? "#fff" : C.ink; x.textAlign = "center"; x.font = F(500, 14); x.fillText(hoursShort(v), cx + cell / 2, ry + rowH / 2); }
      });
      x.textAlign = "right"; x.fillStyle = C.ink; x.font = F(600, 17);
      x.fillText(s.known ? hoursDec(s.total) : "—", W - M - 12, ry + rowH / 2);
      x.fillStyle = C.rule; x.fillRect(gx + st.keys.length * cell, ry + rowH - 1, W - M - gx - st.keys.length * cell, 1);
    });
    const uy = top + rowH * 13;
    x.fillStyle = C.headBg; x.fillRect(M, uy, W - 2 * M, rowH);
    x.textAlign = "left"; x.fillStyle = C.muted; x.font = F(400, 14); x.fillText("Змін", M + 10, uy + rowH / 2);
    st.updates.forEach((u, i) => { if (u) { x.textAlign = "center"; x.fillStyle = C.ink; x.font = F(600, 14); x.fillText(String(u), gx + i * cell + cell / 2, uy + rowH / 2); } });
    x.textAlign = "right"; x.fillStyle = C.ink; x.font = F(600, 17); x.fillText(String(st.totalUpdates), W - M - 12, uy + rowH / 2);
  } else {
    const barX = M + labelW, barW = W - 2 * M - labelW - totalW - avgW - 24;
    x.fillStyle = C.greenDark; x.fillRect(M, top, W - 2 * M, rowH);
    x.fillStyle = "#fff"; x.font = F(500, 15); x.textAlign = "left";
    x.fillText("Група", M + 10, top + rowH / 2); x.fillText("Години без світла за період", barX, top + rowH / 2);
    x.textAlign = "right"; x.fillText("Всього", W - M - avgW - 12, top + rowH / 2); x.fillText("В середньому", W - M - 12, top + rowH / 2);
    const max = Math.max(1, ...st.groups.map(s => s.total));
    const known = st.groups.filter(s => s.known).map(s => s.total);
    const lo = Math.min(...known), hi = Math.max(...known);
    const rel = v => hi > lo ? (v - lo) / (hi - lo) : 0.5;
    st.groups.forEach((s, gi) => {
      const ry = top + rowH * (gi + 1);
      x.textAlign = "left"; x.fillStyle = C.ink; x.font = F(600, 17); x.fillText(s.g, M + 10, ry + rowH / 2);
      x.fillStyle = C.headBg; x.fillRect(barX, ry + 10, barW, rowH - 20);
      x.fillStyle = scaleColor(rel(s.total)); x.fillRect(barX, ry + 10, Math.round(barW * s.total / max), rowH - 20);
      x.textAlign = "right"; x.fillStyle = C.ink; x.font = F(600, 17);
      x.fillText(s.known ? hoursDec(s.total) : "—", W - M - avgW - 12, ry + rowH / 2);
      x.font = F(400, 16); x.fillText(s.known ? `${hoursDec(s.avg)}/день` : "—", W - M - 12, ry + rowH / 2);
      x.fillStyle = C.rule; x.fillRect(M, ry + rowH - 1, W - 2 * M, 1);
    });
  }

  const ly = H - 44;
  x.textAlign = "left"; x.font = F(400, 15); let lx = M;
  if (heatmap) {
    const gw = 240;
    x.fillStyle = C.ink; x.fillText("0 год", lx, ly); lx += x.measureText("0 год").width + 12;
    const g = x.createLinearGradient(lx, 0, lx + gw, 0);
    for (let i = 0; i <= 20; i++) g.addColorStop(i / 20, scaleColor(i / 20));
    x.fillStyle = g; x.fillRect(lx, ly - 8, gw, 16);
    x.fillStyle = C.ink; x.textAlign = "center"; x.fillText("6", lx + gw / 2, ly - 22);
    x.textAlign = "left"; lx += gw + 12; x.fillText("12+ год", lx, ly); lx += x.measureText("12+ год").width + 32;
    x.fillStyle = C.headBg; x.fillRect(lx, ly - 10, 20, 20);
    x.fillStyle = C.ink; x.fillText("немає даних", lx + 30, ly);
  } else {
    x.fillStyle = C.muted; x.fillText(`Днів з графіком: ${st.daysKnown} з ${st.keys.length} · колір: від найменше (зелений) до найбільше (червоний) годин без світла`, lx, ly);
  }
  x.textAlign = "right"; x.fillStyle = C.greenDark; x.font = F(600, 16);
  x.fillText("t.me/lvivpoweroutage", W - M, ly);
  cv.toBlob(b => {
    const a = document.createElement("a");
    const [f, t] = pFrom <= pTo ? [pFrom, pTo] : [pTo, pFrom];
    a.href = URL.createObjectURL(b); a.download = `bez-svitla_${f}_${t}.png`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
}

function renderScale() {
  const a = document.getElementById("gradBar"), b = document.getElementById("gradBar2");
  const stops = (from, to) => Array.from({ length: 11 }, (_, i) => scaleColor(from + (to - from) * i / 10)).join(", ");
  a.style.background = `linear-gradient(90deg, ${stops(0, 0.5)})`;
  b.style.background = `linear-gradient(90deg, ${stops(0.5, 1)})`;
}
renderScale();
function render() { renderMeta(); renderDay(); renderChips(); renderCal(); renderPeriod(); }

function shiftDay(n) { selected = addDays(selected, n); versionIdx = null; const d = dateOf(selected); month = new Date(d.getFullYear(), d.getMonth(), 1); render(); }
document.getElementById("dPrev").onclick = () => shiftDay(-1);
document.getElementById("dNext").onclick = () => shiftDay(1);
document.getElementById("dToday").onclick = () => { selected = keyOf(new Date()); versionIdx = null; month = new Date(new Date().getFullYear(), new Date().getMonth(), 1); render(); };
document.getElementById("mPrev").onclick = () => { month = new Date(month.getFullYear(), month.getMonth() - 1, 1); render(); };
document.getElementById("mNext").onclick = () => { month = new Date(month.getFullYear(), month.getMonth() + 1, 1); render(); };
function bindDateInput(id, set) {
  const el = document.getElementById(id);
  el.addEventListener("input", () => {
    const digits = el.value.replace(/\D/g, "").slice(0, 8);
    let out = digits.slice(0, 2);
    if (digits.length > 2) out += "." + digits.slice(2, 4);
    if (digits.length > 4) out += "." + digits.slice(4);
    el.value = out;
    const k = parseUa(out);
    el.classList.toggle("bad", out.length === 10 && !k);
    if (k) { set(k); preset = ""; renderPeriod(); }
  });
  el.addEventListener("blur", () => renderPeriod());
}
bindDateInput("pFrom", k => { pFrom = k; });
bindDateInput("pTo", k => { pTo = k; });
document.getElementById("png").onclick = exportPNG;

fetch("history.csv?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => {
    days = buildDays(parseCSV(t.replace(/^﻿/, "")));
    if (!days[selected]) {
      const keys = Object.keys(days).sort();
      if (keys.length) { selected = keys[keys.length - 1]; const d = dateOf(selected); month = new Date(d.getFullYear(), d.getMonth(), 1); }
    }
    applyPreset(PRESETS.some(p => p[0] === preset) ? preset : "month");
    render();
  })
  .catch(() => {
    applyPreset("month");
    render();
    document.getElementById("dayBody").innerHTML = `<div class="empty-msg">Ще немає даних. Файл history.csv з'явиться в репозиторії після першого графіка, який збереже бот.</div>`;
  });
