<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Графік відключень · Львів</title>
<link rel="icon" href="assets/logo-mark.png">
<style>
@font-face { font-family: "Carlito"; src: url("assets/Carlito-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Fira Sans"; src: url("assets/FiraSans-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Fira Sans"; src: url("assets/FiraSans-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Fira Sans"; src: url("assets/FiraSans-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }

:root {
  --green: #5d894a;
  --green-dark: #426334;
  --orange: #ed952c;
  --ink: #1f2420;
  --muted: #6e756c;
  --rule: #dbe0d6;
  --head-bg: #f1f4ee;
  --bg: #ffffff;
  --on: #e3eddc;
  --off: #9e3430;
  --cancelled: #8ccb6e;
  --extra: #ed952c;
  --h1: #ecd3c4;
  --h2: #d9a089;
  --h3: #bf6455;
  --h4: #9e3430;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 "Fira Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

.top { background: var(--green); color: #fff; }
.top .in { max-width: 1240px; margin: 0 auto; padding: 28px 32px; display: flex; align-items: center; gap: 28px; }
.top img { height: 64px; width: auto; display: block; }
.top h1 { font: 700 44px/1 "Carlito", sans-serif; margin: 0; letter-spacing: -0.005em; }
.top .sub { font: 700 26px/1.1 "Carlito", sans-serif; color: var(--orange); margin-top: 8px; }
.top .meta { margin-left: auto; text-align: right; }
.top .meta small { display: block; color: #dee9d6; font-size: 15px; }
.top .meta b { font-weight: 600; font-size: 22px; }

main { max-width: 1240px; margin: 0 auto; padding: 8px 32px 48px; }
section { padding: 32px 0; border-bottom: 1px solid var(--rule); }
section:last-of-type { border-bottom: 0; }
.bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.bar h2 { font: 700 30px/1.1 "Carlito", sans-serif; margin: 0; }
.bar .note { color: var(--muted); font-size: 15px; }
.nav { display: inline-flex; gap: 6px; margin-left: auto; }
.nav button, .btn {
  background: #fff; border: 1px solid var(--rule); padding: 7px 14px; cursor: pointer; font-weight: 500;
}
.nav button:hover, .btn:hover { border-color: var(--green); }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn.primary:hover { background: var(--green-dark); }
.btn:disabled { opacity: .45; cursor: default; }

.days { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grid { display: grid; grid-template-columns: 116px repeat(12, 1fr); }
.grid .h { background: var(--green-dark); color: #fff; font-weight: 500; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
.grid .h.t { justify-content: flex-start; padding-left: 12px; }
.grid .s { background: var(--head-bg); height: 46px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.grid .s.t { justify-content: flex-start; padding-left: 12px; font-weight: 400; font-size: 14px; color: var(--muted); }
.grid .t.r { height: 34px; display: flex; align-items: center; padding-left: 12px; font-size: 16px; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.grid .c { height: 34px; border: 1px solid #fff; background: var(--on); }
.grid .c.off { background: var(--off); }
.grid .c.cancelled { background: var(--cancelled); }
.grid .c.extra { background: var(--extra); }
.grid .mine { box-shadow: inset 0 -3px 0 var(--orange); }

.legend { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 20px; font-size: 16px; }
.legend span { display: inline-flex; align-items: center; gap: 10px; }
.legend i { width: 20px; height: 20px; display: inline-block; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { background: #fff; border: 1px solid var(--rule); padding: 6px 12px; cursor: pointer; font-weight: 500; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--green-dark); border-color: var(--green-dark); color: #fff; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dow { font-size: 14px; color: var(--muted); padding: 0 8px 4px; }
.day { height: 84px; border: 0; padding: 8px 10px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; background: var(--head-bg); color: var(--ink); }
.day.empty { background: none; cursor: default; }
.day b { font-weight: 600; font-size: 17px; }
.day span { font-size: 15px; font-variant-numeric: tabular-nums; }
.day.nodata span { color: var(--muted); }
.day.dark { color: #fff; }
.day.sel { outline: 3px solid var(--orange); outline-offset: -3px; }
.day.today b { text-decoration: underline; text-decoration-color: var(--orange); text-decoration-thickness: 3px; text-underline-offset: 3px; }

table.sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.sum th { background: var(--green-dark); color: #fff; font-weight: 500; text-align: right; padding: 12px; font-size: 15px; }
table.sum th:first-child, table.sum td:first-child { text-align: left; }
table.sum td { padding: 11px 12px; border-bottom: 1px solid var(--rule); text-align: right; font-size: 16px; }
table.sum tr.mine td { background: var(--head-bg); font-weight: 600; }

.empty-msg { padding: 28px; background: var(--head-bg); color: var(--muted); }
footer { max-width: 1240px; margin: 0 auto; padding: 0 32px 40px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 15px; }
footer a { color: var(--green-dark); font-weight: 600; text-decoration: none; }

@media (max-width: 1000px) {
  .days { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .top .in { padding: 20px 16px; gap: 16px; flex-wrap: wrap; }
  .top img { height: 44px; }
  .top h1 { font-size: 30px; }
  .top .sub { font-size: 20px; }
  .top .meta { margin-left: 0; text-align: left; width: 100%; }
  main { padding: 0 16px 32px; }
  footer { padding: 0 16px 32px; }
  .bar h2 { font-size: 24px; }
  .nav { margin-left: 0; }
  .grid { grid-template-columns: 92px repeat(12, 1fr); }
  .grid .h { font-size: 13px; height: 40px; }
  .grid .s { font-size: 13px; height: 40px; }
  .grid .s.t { font-size: 12px; padding-left: 8px; }
  .grid .h.t, .grid .t.r { padding-left: 8px; }
  .grid .t.r { font-size: 13px; height: 30px; }
  .grid .c { height: 30px; }
  .day { height: 62px; padding: 6px; }
  .day b { font-size: 15px; }
  .day span { font-size: 12px; }
  .hide-sm { display: none; }
  table.sum td, table.sum th { padding: 10px 6px; font-size: 14px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <img src="assets/logo-mark.png" alt="Львів Електрохарчування">
    <div>
      <h1>Графік погодинних відключень</h1>
      <div class="sub">Львів · календар і статистика</div>
    </div>
    <div class="meta" id="meta"></div>
  </div>
</header>

<main>
  <section id="daySec">
    <div class="bar">
      <h2 id="dayTitle">—</h2>
      <span class="note" id="dayNote"></span>
      <div class="nav">
        <button id="dPrev" aria-label="Попередній день">‹</button>
        <button id="dToday">Сьогодні</button>
        <button id="dNext" aria-label="Наступний день">›</button>
      </div>
    </div>
    <div id="dayBody"></div>
  </section>

  <section>
    <div class="bar">
      <h2 id="monthTitle">—</h2>
      <span class="note">Скільки годин не було світла за день</span>
      <div class="nav">
        <button id="mPrev" aria-label="Попередній місяць">‹</button>
        <button id="mNext" aria-label="Наступний місяць">›</button>
      </div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Моя група"></div>
    <div class="cal" id="cal"></div>
    <div class="legend">
      <span><i style="background:var(--on)"></i>0 год</span>
      <span><i style="background:var(--h1)"></i>до 4 год</span>
      <span><i style="background:var(--h2)"></i>4–8 год</span>
      <span><i style="background:var(--h3)"></i>8–12 год</span>
      <span><i style="background:var(--h4)"></i>понад 12 год</span>
      <span><i style="background:var(--head-bg)"></i>немає даних</span>
    </div>
  </section>

  <section>
    <div class="bar">
      <h2 id="sumTitle">Підсумок місяця</h2>
      <span class="note">Сума за дні, для яких є графік</span>
      <div class="nav"><button class="btn primary" id="png">Завантажити PNG</button></div>
    </div>
    <div id="sum"></div>
  </section>
</main>

<footer>
  <span>Дані: графіки Львівобленерго, зібрані ботом</span>
  <a href="https://t.me/lvivpoweroutage">t.me/lvivpoweroutage</a>
</footer>

<script>
const GROUPS = ["1.1","1.2","2.1","2.2","3.1","3.2","4.1","4.2","5.1","5.2","6.1","6.2"];
const MONTHS = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
const MONTHS_GEN = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const MONTHS_LOC = ["січні","лютому","березні","квітні","травні","червні","липні","серпні","вересні","жовтні","листопаді","грудні"];
const WEEKDAYS = ["Неділя","Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];
const DOW = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
const C = { green: "#5d894a", greenDark: "#426334", orange: "#ed952c", ink: "#1f2420", muted: "#6e756c", rule: "#dbe0d6", headBg: "#f1f4ee",
  on: "#e3eddc", h: ["#ecd3c4", "#d9a089", "#bf6455", "#9e3430"] };

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

let days = {};
let group = store.get("loe-group", "1.1");
if (!GROUPS.includes(group)) group = "1.1";
let month = new Date(); month = new Date(month.getFullYear(), month.getMonth(), 1);
let selected = null;

const pad = n => String(n).padStart(2, "0");
const esc = v => String(v).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const TIME_RE = /^([01]\d|2[0-4]):[0-5]\d$/;
const DATE_RE = /^\d{2}\.\d{2}\.\d{4}$/;
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const hhmm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;

function hoursShort(min) {
  if (min == null) return "—";
  const h = Math.floor(min / 60), m = min % 60;
  return m === 0 ? String(h) : m === 30 ? `${h},5` : `${h}:${pad(m)}`;
}
function hoursLong(min) {
  if (min == null) return "—";
  if (min === 0) return "0 год";
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return `${h} год ${m} хв`;
  return h ? `${h} год` : `${m} хв`;
}

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(f); f = ""; if (row.some(x => x !== "")) rows.push(row); row = [];
    } else f += ch;
  }
  row.push(f); if (row.some(x => x !== "")) rows.push(row);
  return rows;
}

function slots(iv) {
  const out = new Array(48).fill(false);
  for (const [a, b] of iv || []) {
    const s = toMin(a), e = toMin(b);
    for (let i = 0; i < 48; i++) if (s < (i + 1) * 30 && e > i * 30) out[i] = true;
  }
  return out;
}

function buildDays(rows) {
  const [head, ...body] = rows;
  const ix = n => head.indexOf(n);
  const I = { at: ix("зафіксовано"), date: ix("дата"), upd: ix("станом_на"), g: ix("група"), a: ix("з"), b: ix("до") };
  const versions = {};
  for (const r of body) {
    const date = r[I.date]; if (!date || !DATE_RE.test(date)) continue;
    const [dd, mm, yy] = date.split(".");
    const k = `${yy}-${mm}-${dd}`;
    const vk = r[I.at] + "|" + r[I.upd];
    const v = ((versions[k] ||= {})[vk] ||= { at: r[I.at], updated: r[I.upd], groups: {} });
    const g = r[I.g]; if (!GROUPS.includes(g)) continue;
    (v.groups[g] ||= []);
    if (TIME_RE.test(r[I.a]) && TIME_RE.test(r[I.b])) v.groups[g].push([r[I.a], r[I.b]]);
  }
  const out = {};
  for (const [k, vs] of Object.entries(versions)) {
    const list = Object.values(vs).sort((x, y) => (x.at + x.updated).localeCompare(y.at + y.updated));
    const last = list[list.length - 1], prev = list.length > 1 ? list[list.length - 2] : null;
    const minutes = {};
    for (const g of GROUPS) {
      const iv = last.groups[g];
      minutes[g] = iv ? iv.reduce((s, [a, b]) => s + toMin(b) - toMin(a), 0) : null;
    }
    out[k] = { updated: last.updated, groups: last.groups, prev: prev && prev.groups, minutes, versions: list.length };
  }
  return out;
}

function heat(min) {
  if (min == null) return ["var(--head-bg)", false];
  if (min === 0) return ["var(--on)", false];
  if (min < 240) return ["var(--h1)", false];
  if (min < 480) return ["var(--h2)", false];
  if (min < 720) return ["var(--h3)", true];
  return ["var(--h4)", true];
}
function heatHex(min) {
  if (min == null) return C.headBg;
  if (min === 0) return C.on;
  return min < 240 ? C.h[0] : min < 480 ? C.h[1] : min < 720 ? C.h[2] : C.h[3];
}

function renderMeta() {
  const keys = Object.keys(days).sort();
  const last = keys.length ? days[keys[keys.length - 1]] : null;
  document.getElementById("meta").innerHTML = last && last.updated
    ? `<small>Останнє оновлення</small><b>${esc(last.updated)}</b>` : "";
}

function renderDay() {
  const body = document.getElementById("dayBody");
  const d = dateOf(selected);
  document.getElementById("dayTitle").textContent = `${WEEKDAYS[d.getDay()]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`;
  const info = days[selected];
  const note = document.getElementById("dayNote");
  if (!info) {
    note.textContent = "";
    body.innerHTML = `<div class="empty-msg">Для цього дня графіка немає.</div>`;
    return;
  }
  note.textContent = `Станом на ${info.updated || "—"}` + (info.versions > 1 ? ` · оновлювався ${info.versions} раз(и)` : "");
  const ns = {}, os = {};
  for (const g of GROUPS) { ns[g] = slots(info.groups[g]); os[g] = info.prev ? slots(info.prev[g]) : null; }
  const cls = (g, i) => {
    const n = ns[g][i], o = os[g];
    if (o && n && !o[i]) return "c extra";
    if (o && !n && o[i]) return "c cancelled";
    return n ? "c off" : "c";
  };
  let html = `<div class="days">`;
  for (let half = 0; half < 2; half++) {
    html += `<div class="grid"><div class="h t">Час</div>`;
    html += GROUPS.map(g => `<div class="h">${g}</div>`).join("");
    html += `<div class="s t">Год. за добу</div>`;
    html += GROUPS.map(g => `<div class="s${g === group ? " mine" : ""}">${hoursShort(info.minutes[g])}</div>`).join("");
    for (let r = 0; r < 24; r++) {
      const i = half * 24 + r;
      html += `<div class="t r">${hhmm(i * 30)}–${hhmm(i * 30 + 30)}</div>`;
      html += GROUPS.map(g => `<div class="${cls(g, i)}"></div>`).join("");
    }
    html += `</div>`;
  }
  html += `</div><div class="legend">
    <span><i style="background:var(--on)"></i>Є світло</span>
    <span><i style="background:var(--off)"></i>Немає світла</span>
    ${info.prev ? `<span><i style="background:var(--cancelled)"></i>Відключення скасоване</span>
    <span><i style="background:var(--extra)"></i>Додаткове відключення</span>` : ""}
  </div>`;
  body.innerHTML = html;
}

function renderChips() {
  const el = document.getElementById("chips");
  el.innerHTML = "";
  for (const g of GROUPS) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = g;
    b.setAttribute("aria-pressed", String(g === group));
    b.onclick = () => { group = g; store.set("loe-group", g); render(); };
    el.appendChild(b);
  }
}

function renderCal() {
  const y = month.getFullYear(), m = month.getMonth();
  document.getElementById("monthTitle").textContent = `${MONTHS[m]} ${y} · група ${group}`;
  const cal = document.getElementById("cal");
  cal.innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join("");
  const first = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < first; i++) cal.insertAdjacentHTML("beforeend", `<div class="day empty"></div>`);
  const today = keyOf(new Date());
  for (let d = 1; d <= n; d++) {
    const k = keyOf(new Date(y, m, d)), info = days[k], min = info ? info.minutes[group] : null;
    const [bg, dark] = heat(min);
    const b = document.createElement("button");
    b.className = "day" + (min == null ? " nodata" : "") + (dark ? " dark" : "") + (k === selected ? " sel" : "") + (k === today ? " today" : "");
    b.style.background = bg;
    b.innerHTML = `<b>${d}</b><span>${min == null ? "—" : hoursLong(min)}</span>`;
    b.onclick = () => { selected = k; render(); document.getElementById("daySec").scrollIntoView({ behavior: "smooth" }); };
    cal.appendChild(b);
  }
}

function monthStats() {
  const y = month.getFullYear(), m = month.getMonth(), n = new Date(y, m + 1, 0).getDate();
  return GROUPS.map(g => {
    let total = 0, known = 0, withOut = 0; const perDay = [];
    for (let d = 1; d <= n; d++) {
      const info = days[keyOf(new Date(y, m, d))], v = info ? info.minutes[g] : null;
      perDay.push(v); if (v != null) { known++; total += v; if (v > 0) withOut++; }
    }
    return { g, total, known, withOut, avg: known ? Math.round(total / known) : null, perDay };
  });
}

function renderSum() {
  const m = month.getMonth();
  document.getElementById("sumTitle").textContent = `Підсумок: ${MONTHS[m].toLowerCase()} ${month.getFullYear()}`;
  const st = monthStats(), any = st.some(s => s.known);
  document.getElementById("png").disabled = !any;
  document.getElementById("sum").innerHTML = any ? `<table class="sum">
    <tr><th>Група</th><th class="hide-sm">Днів з графіком</th><th class="hide-sm">Днів з відключеннями</th><th>Всього без світла</th><th>В середньому за день</th></tr>
    ${st.map(s => `<tr class="${s.g === group ? "mine" : ""}"><td>${s.g}</td><td class="hide-sm">${s.known}</td><td class="hide-sm">${s.withOut}</td><td>${hoursLong(s.total)}</td><td>${hoursLong(s.avg)}</td></tr>`).join("")}
  </table>` : `<div class="empty-msg">За цей місяць даних немає.</div>`;
}

async function exportPNG() {
  const y = month.getFullYear(), m = month.getMonth(), n = new Date(y, m + 1, 0).getDate();
  const st = monthStats();
  await document.fonts.ready;
  const logo = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = "assets/logo-mark.png"; });
  const S = 2, M = 32, headH = 150, labelW = 64, cell = 38, totalW = 140, rowH = 40, top = headH + 36;
  const W = M * 2 + labelW + n * cell + totalW;
  const H = top + rowH * 13 + 90;
  const c = document.createElement("canvas"); c.width = W * S; c.height = H * S;
  const x = c.getContext("2d"); x.scale(S, S);
  const fira = w => `${w} {s}px "Fira Sans", sans-serif`;
  const F = (w, s) => fira(w).replace("{s}", s);
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
  x.fillStyle = C.green; x.fillRect(0, 0, W, headH);
  let tx = M;
  if (logo) { const lh = 64, lw = logo.width * lh / logo.height; x.drawImage(logo, M, (headH - lh) / 2, lw, lh); tx = M + lw + 28; }
  x.textBaseline = "alphabetic";
  x.fillStyle = "#fff"; x.font = `700 44px "Carlito", sans-serif`;
  x.fillText(`Без світла у ${MONTHS_LOC[m]} ${y}`, tx, 76);
  x.fillStyle = C.orange; x.font = `700 26px "Carlito", sans-serif`;
  x.fillText("Години без електроенергії за добу, по групах", tx, 114);
  x.textBaseline = "middle"; x.textAlign = "center";
  const gx = M + labelW;
  x.fillStyle = C.greenDark; x.fillRect(M, top, W - 2 * M, rowH);
  x.fillStyle = "#fff"; x.font = F(500, 16);
  x.textAlign = "left"; x.fillText("Група", M + 10, top + rowH / 2); x.textAlign = "center";
  for (let d = 1; d <= n; d++) x.fillText(String(d), gx + (d - 1) * cell + cell / 2, top + rowH / 2);
  x.textAlign = "right"; x.fillText("Всього", W - M - 12, top + rowH / 2);
  st.forEach((s, i) => {
    const ry = top + rowH * (i + 1);
    x.textAlign = "left"; x.fillStyle = C.ink; x.font = F(600, 17);
    x.fillText(s.g, M + 10, ry + rowH / 2);
    s.perDay.forEach((v, d) => {
      const cx = gx + d * cell;
      x.fillStyle = heatHex(v); x.fillRect(cx + 1, ry + 1, cell - 2, rowH - 2);
      if (v != null) {
        x.fillStyle = v >= 480 ? "#fff" : C.ink; x.textAlign = "center"; x.font = F(500, 14);
        x.fillText(hoursShort(v), cx + cell / 2, ry + rowH / 2);
      }
    });
    x.textAlign = "right"; x.fillStyle = C.ink; x.font = F(600, 17);
    x.fillText(s.known ? hoursLong(s.total) : "—", W - M - 12, ry + rowH / 2);
    x.fillStyle = C.rule; x.fillRect(gx + n * cell, ry + rowH - 1, totalW, 1);
  });
  const ly = top + rowH * 13 + 40;
  x.textAlign = "left"; x.font = F(400, 16);
  let lx = M;
  [["0 год", C.on], ["до 4", C.h[0]], ["4–8", C.h[1]], ["8–12", C.h[2]], ["12+", C.h[3]], ["немає даних", C.headBg]].forEach(([t, col]) => {
    x.fillStyle = col; x.fillRect(lx, ly - 10, 20, 20);
    x.fillStyle = C.ink; x.fillText(t, lx + 30, ly); lx += 30 + x.measureText(t).width + 30;
  });
  x.textAlign = "right"; x.fillStyle = C.greenDark; x.font = F(600, 16);
  x.fillText("t.me/lvivpoweroutage", W - M, ly);
  c.toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = `bez-svitla-${y}-${pad(m + 1)}.png`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
}

function render() { renderMeta(); renderDay(); renderChips(); renderCal(); renderSum(); }

function shiftDay(n) { const d = dateOf(selected); d.setDate(d.getDate() + n); selected = keyOf(d); month = new Date(d.getFullYear(), d.getMonth(), 1); render(); }
document.getElementById("dPrev").onclick = () => shiftDay(-1);
document.getElementById("dNext").onclick = () => shiftDay(1);
document.getElementById("dToday").onclick = () => { const t = new Date(); selected = keyOf(t); month = new Date(t.getFullYear(), t.getMonth(), 1); render(); };
document.getElementById("mPrev").onclick = () => { month = new Date(month.getFullYear(), month.getMonth() - 1, 1); render(); };
document.getElementById("mNext").onclick = () => { month = new Date(month.getFullYear(), month.getMonth() + 1, 1); render(); };
document.getElementById("png").onclick = exportPNG;

selected = keyOf(new Date());
fetch("history.csv?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => {
    days = buildDays(parseCSV(t.replace(/^﻿/, "")));
    if (!days[selected]) {
      const keys = Object.keys(days).sort();
      if (keys.length) { selected = keys[keys.length - 1]; const d = dateOf(selected); month = new Date(d.getFullYear(), d.getMonth(), 1); }
    }
    render();
  })
  .catch(() => {
    render();
    document.getElementById("dayBody").innerHTML = `<div class="empty-msg">Ще немає даних. Файл history.csv з'явиться в репозиторії після першого графіка, який збереже бот.</div>`;
  });
</script>
</body>
