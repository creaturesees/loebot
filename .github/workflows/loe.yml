name: LOE schedule check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loe-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow

      - name: Check schedule
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          HC_URL: ${{ secrets.HC_URL }}
          TG_EMOJI_ID: ${{ secrets.TG_EMOJI_ID }}
          DISCORD_EMOJI_ID: ${{ secrets.DISCORD_EMOJI_ID }}
        run: python loe_bot.py

      - name: Save state
        run: |
          git config user.name "loe-bot"
          git config user.email "loe-bot@users.noreply.github.com"
          for f in last_hash.txt last_schedules.json history.csv; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "update schedule hash" && git pull --rebase && git push)
