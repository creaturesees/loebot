name: LOE emergency outages

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loe-accidents
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check emergency outages
        run: python loe_accidents.py

      - name: Save state
        run: |
          git config user.name "loe-bot"
          git config user.email "loe-bot@users.noreply.github.com"
          if [ -f accidents.json ]; then git add accidents.json; fi
          git diff --cached --quiet || (git commit -m "update emergency outages" && git pull --rebase && git push)
